{% extends 'base.html' %}
{% block title %}My Profile — LocalFind{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="mb-1"><i class="bi bi-person-circle"></i> My Profile</h3>
        <p class="text-muted mb-4">{{ user.email }}</p>
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label fw-semibold">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <div class="text-danger small mt-1">{{ field.errors|join:", " }}</div>
            {% endif %}
          </div>
          {% endfor %}
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <a href="{% url 'items:dashboard' %}" class="btn btn-outline-secondary ms-2">Dashboard</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
