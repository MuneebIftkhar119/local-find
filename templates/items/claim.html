{% extends 'base.html' %}
{% block title %}Claim Item — LocalFind{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="mb-1"><i class="bi bi-hand-index"></i> Submit a Claim</h3>
        <p class="text-muted mb-4">For: <strong>{{ item.title }}</strong></p>
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label fw-semibold">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <div class="text-danger small mt-1">{{ field.errors|join:", " }}</div>
            {% endif %}
          </div>
          {% endfor %}
          <button type="submit" class="btn btn-success w-100">Submit Claim</button>
          <a href="{% url 'items:detail' item.pk %}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
